# BFF:前端页面 + /api/ustudio/* 场景数据 + /api/scene-events 命令流代理
services:
  bff:
    image: ${IMAGE_BFF:-firerescue-bff}:${TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.bff
    restart: unless-stopped
    env_file: .env
    environment:
      # BFF 连 mcp 的容器内地址(与 mcp 的 WEB_BFF_URL 对称)
      MCP_INTERNAL_URL: http://mcp:8787
    ports:
      - "3000:3000" # 对外:浏览器访问前端页面 + /api/*(演示用)
    expose:
      - "3000" # 容器间:mcp 经 WEB_BFF_URL=http://bff:3000 访问
    networks:
      - fr-net

  # MCP server:agent 直接连 8787
  mcp:
    image: ${IMAGE_MCP:-firerescue-mcp}:${TAG:-latest}
    build:
      context: ../mcp-server
      dockerfile: ../deploy/Dockerfile.mcp
    restart: unless-stopped
    env_file: .env
    environment:
      WEB_BFF_URL: http://bff:3000
    ports:
      - "8787:8787"
    depends_on:
      - bff
    networks:
      - fr-net

networks:
  fr-net:
    driver: bridge
