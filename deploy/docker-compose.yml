# BFF:前端页面 + /api/ustudio/* 场景数据 + /api/scene-events 命令流代理
services:
  bff:
    image: ${IMAGE_BFF:-firerescue-bff}:${TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.bff
      # NEXT_PUBLIC_* 在 next build 时固化进客户端 bundle,运行时 env 无效,
      # 必须以 build args 注入(compose 自动从同目录 .env 插值;
      # 此前只有 deploy-server.sh/CI 传参,手动 compose build 会丢 → 前端无 X-App-Key,
      # agent 聊天网关 401「智能体服务连接失败」——2026-08-17 生产踩坑修复)。
      args:
        NEXT_PUBLIC_X_APP_KEY: ${NEXT_PUBLIC_X_APP_KEY:-}
        NEXT_PUBLIC_USTUDIO_BASE: ${NEXT_PUBLIC_USTUDIO_BASE:-https://fc.xwbuilders.com}
        NEXT_PUBLIC_SCENE_EVENTS_URL: ${NEXT_PUBLIC_SCENE_EVENTS_URL:-/api/scene-events}
        NEXT_PUBLIC_LOCALE: ${NEXT_PUBLIC_LOCALE:-zh-CN}
        NEXT_PUBLIC_OBJECTS_APP_ID: ${NEXT_PUBLIC_OBJECTS_APP_ID:-}
        NEXT_PUBLIC_TRAINING_APP_ID: ${NEXT_PUBLIC_TRAINING_APP_ID:-}
        NEXT_PUBLIC_COMMAND_APP_ID: ${NEXT_PUBLIC_COMMAND_APP_ID:-}
        NEXT_PUBLIC_DRILL_COMMANDER_APP_ID: ${NEXT_PUBLIC_DRILL_COMMANDER_APP_ID:-}
        NEXT_PUBLIC_ADVERSARY_APP_ID: ${NEXT_PUBLIC_ADVERSARY_APP_ID:-}
        NEXT_PUBLIC_EVALUATE_APP_ID: ${NEXT_PUBLIC_EVALUATE_APP_ID:-}
        NEXT_PUBLIC_GLOBAL_AGENT_APP_ID: ${NEXT_PUBLIC_GLOBAL_AGENT_APP_ID:-}
        NEXT_PUBLIC_DRILL_PLANNER_APP_ID: ${NEXT_PUBLIC_DRILL_PLANNER_APP_ID:-}
    restart: unless-stopped
    env_file: .env
    environment:
      # BFF 连 mcp 的容器内地址(与 mcp 的 WEB_BFF_URL 对称)
      MCP_INTERNAL_URL: http://mcp:8787
    ports:
      - "3000:3000" # 对外:浏览器访问前端页面 + /api/*(演示用)
    expose:
      - "3000" # 容器间:mcp 经 WEB_BFF_URL=http://bff:3000 访问
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - fr-net

  # MCP server:agent 直接连 8787
  mcp:
    image: ${IMAGE_MCP:-firerescue-mcp}:${TAG:-latest}
    build:
      context: ../mcp-server
      dockerfile: ../deploy/Dockerfile.mcp
    restart: unless-stopped
    env_file: .env
    environment:
      WEB_BFF_URL: http://bff:3000
      DRILL_SESSION_FILE: /data/drill-sessions.json
    volumes:
      - drill_sessions:/data
    ports:
      - "8787:8787"
    depends_on:
      bff:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - fr-net

networks:
  fr-net:
    driver: bridge

volumes:
  drill_sessions:
