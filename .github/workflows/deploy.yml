name: Build & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase GHCR image names
        run: |
          # GHCR 镜像名必须小写,而 github.repository 可能含大写(如 FireRescueAIWeb)
          REPO="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_BFF=${REPO}-bff" >> "$GITHUB_ENV"
          echo "IMAGE_MCP=${REPO}-mcp" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & push BFF image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.bff
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_BFF }}:latest
          # NEXT_PUBLIC_* 在 build 时固化进前端 bundle,必须从 GitHub Secrets 注入
          # (值与服务器 deploy/.env 保持一致;未配则传空,前端走默认值)。
          build-args: |
            NEXT_PUBLIC_X_APP_KEY=${{ secrets.NEXT_PUBLIC_X_APP_KEY }}
            NEXT_PUBLIC_USTUDIO_BASE=${{ secrets.NEXT_PUBLIC_USTUDIO_BASE }}
            NEXT_PUBLIC_SCENE_EVENTS_URL=${{ secrets.NEXT_PUBLIC_SCENE_EVENTS_URL }}
            NEXT_PUBLIC_LOCALE=${{ secrets.NEXT_PUBLIC_LOCALE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push MCP image
        uses: docker/build-push-action@v6
        with:
          context: ./mcp-server
          file: deploy/Dockerfile.mcp
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_MCP }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 部署:独立 job(不依赖 build-images,避免 ghcr 问题阻塞上线)。
  # 2026-08-14 改为「服务器本地构建」(deploy/deploy-server.sh):不经 ghcr 拉大镜像,
  # 规避服务器→ghcr blob 下载挂起;部署侧不再需要 GHCR_TOKEN。
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -e
            # 部署目录优先级:SERVER_APP_DIR secret → 探测 $HOME/jjxf/FireRescueAIWeb → 报错
            # (不再静默 fallback 到 /opt/firerescue —— 那是空目录,是历史 deploy 失败的根因)
            APP_DIR="${{ secrets.SERVER_APP_DIR }}"
            if [ -z "$APP_DIR" ] || [ ! -d "$APP_DIR/.git" ]; then
              if [ -d "$HOME/jjxf/FireRescueAIWeb/.git" ]; then
                APP_DIR="$HOME/jjxf/FireRescueAIWeb"
              else
                echo "❌ 找不到部署目录:SERVER_APP_DIR 未配置且 $HOME/jjxf/FireRescueAIWeb 不存在"
                exit 1
              fi
            fi
            APP_DIR="${APP_DIR/#\~/$HOME}"
            echo "==> 部署目录: $APP_DIR"
            cd "$APP_DIR"
            # 工作区有未提交修改时提示(避免用旧源码构建)
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "⚠️ 工作区有未提交修改,将按当前源码构建;如需干净构建请先提交"
            fi
            git pull --ff-only || echo "⚠️ git pull 失败(非仓库/冲突),继续用当前源码"
            # 本地构建 BFF(firerescue-bff:local)+ MCP(firerescue-mcp:local)+ compose up
            bash deploy/deploy-server.sh
