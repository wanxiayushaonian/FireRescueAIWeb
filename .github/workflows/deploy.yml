name: Build & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase GHCR image names
        run: |
          # GHCR 镜像名必须小写,而 github.repository 可能含大写(如 FireRescueAIWeb)
          REPO="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_BFF=${REPO}-bff" >> "$GITHUB_ENV"
          echo "IMAGE_MCP=${REPO}-mcp" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & push BFF image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.bff
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_BFF }}:latest
          # NEXT_PUBLIC_* 在 build 时固化进前端 bundle,必须从 GitHub Secrets 注入
          # (值与服务器 deploy/.env 保持一致;未配则传空,前端走默认值)。
          build-args: |
            NEXT_PUBLIC_X_APP_KEY=${{ secrets.NEXT_PUBLIC_X_APP_KEY }}
            NEXT_PUBLIC_USTUDIO_BASE=${{ secrets.NEXT_PUBLIC_USTUDIO_BASE }}
            NEXT_PUBLIC_SCENE_EVENTS_URL=${{ secrets.NEXT_PUBLIC_SCENE_EVENTS_URL }}
            NEXT_PUBLIC_LOCALE=${{ secrets.NEXT_PUBLIC_LOCALE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push MCP image
        uses: docker/build-push-action@v6
        with:
          context: ./mcp-server
          file: deploy/Dockerfile.mcp
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_MCP }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            # 服务器部署目录:默认 /opt/firerescue,可用 SERVER_APP_DIR secret 覆盖(如 ~/jjxf/...)
            cd "${{ secrets.SERVER_APP_DIR || '/opt/firerescue' }}"
            # 同步仓库最新 docker-compose.yml(/opt/firerescue 需是 git clone;非仓库则跳过)
            git pull --ff-only || echo "⚠️ git pull 失败:确认 /opt/firerescue 是仓库 clone,或手动同步 deploy/docker-compose.yml"
            export GHCR_USER="${{ github.actor }}"
            export GHCR_TOKEN="${{ secrets.GHCR_TOKEN }}"
            export REPO="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
            export IMAGE_BFF="ghcr.io/${REPO}-bff"
            export IMAGE_MCP="ghcr.io/${REPO}-mcp"
            docker login ghcr.io -u "$GHCR_USER" -p "$GHCR_TOKEN"
            docker compose -f deploy/docker-compose.yml pull
            docker compose -f deploy/docker-compose.yml up -d --remove-orphans
            docker image prune -f || true
